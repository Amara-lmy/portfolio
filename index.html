<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李明瑶 · 作品集 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #525659;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
    min-height: 100vh;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 1000;
    background: #2c2c2c; color: #fff;
    padding: 12px 20px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    flex-wrap: wrap; gap: 10px;
  }
  .toolbar .title { font-size: 16px; font-weight: 600; }
  .toolbar .actions { display: flex; gap: 10px; align-items: center; }
  .toolbar a {
    color: #fff; text-decoration: none;
    padding: 8px 18px; background: #4a90e2; border-radius: 4px; font-size: 14px;
  }
  .toolbar a:hover { background: #357ABD; }
  .toolbar .page-info { font-size: 13px; color: #aaa; }
  #pdf-container { max-width: 1000px; margin: 0 auto; padding: 16px 10px 40px; }
  .page-wrapper {
    margin: 0 auto 14px; position: relative; background: #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); max-width: 100%;
  }
  .page-wrapper canvas { display: block; width: 100%; height: auto; }
  /* 文本层：透明覆盖在 canvas 上，让文字可选、链接可点 */
  .textLayer {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    overflow: hidden; opacity: .25; line-height: 1;
  }
  .textLayer > span, .textLayer > br {
    color: transparent; position: absolute; white-space: pre; cursor: text;
    transform-origin: 0% 0%;
  }
  .textLayer ::selection { background: rgba(0,100,255,.3); }
  .textLayer a { color: transparent; }
  .page-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 13px; background: #f5f5f5;
  }
  .page-loading .spinner {
    width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #4a90e2;
    border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { text-align: center; padding: 80px 20px; color: #ccc; font-size: 15px; }
  .status .spinner {
    display: inline-block; width: 32px; height: 32px; border: 3px solid #555;
    border-top-color: #4a90e2; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 16px;
  }
  .progress-bar {
    width: 220px; max-width: 80%; height: 4px; background: #444; border-radius: 2px;
    margin: 14px auto 0; overflow: hidden;
  }
  .progress-bar > div { height: 100%; background: #4a90e2; width: 0; transition: width .3s; }
  .error-fallback { text-align: center; padding: 40px 20px; line-height: 1.8; }
  .error-fallback a {
    display: inline-block; color: #4a90e2; text-decoration: none;
    padding: 12px 30px; border: 2px solid #4a90e2; border-radius: 6px; margin-top: 15px; font-size: 15px;
  }
</style>
</head>
<body>
<div class="toolbar">
  <div class="title">李明瑶 · 作品集 2026</div>
  <div class="actions">
    <span class="page-info" id="pageInfo">加载中...</span>
    <a href="portfolio-limingyao-2026.pdf" download>下载 PDF</a>
  </div>
</div>

<div id="pdf-container">
  <div class="status" id="status">
    <div class="spinner"></div>
    <div id="statusText">正在加载作品集，请稍候...</div>
    <div class="progress-bar"><div id="progressBar"></div></div>
  </div>
</div>

<script src="pdf.min.js"></script>
<script src="pdf.worker.min.js"></script>
<script>
(function() {
  var PDF_URL = 'portfolio-limingyao-2026.pdf';
  var container = document.getElementById('pdf-container');
  var status = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var pageInfo = document.getElementById('pageInfo');
  var progressBar = document.getElementById('progressBar');

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

  // 链接跳转处理：点击 PDF 内的链接时，在新标签页打开
  var linkService = new pdfjsLib.PDFLinkService();
  linkService.externalLinkTarget = pdfjsLib.LinkTarget.BLANK;
  linkService.externalLinkRel = 'noopener noreferrer';

  var loadingTask = pdfjsLib.getDocument({
    url: PDF_URL,
    cMapUrl: 'cmaps/',
    cMapPacked: true
  });

  loadingTask.onProgress = function(progress) {
    if (progress.total) {
      var percent = Math.round((progress.loaded / progress.total) * 100);
      progressBar.style.width = percent + '%';
      statusText.textContent = '正在加载作品集 ' + percent + '%';
    }
  };

  loadingTask.promise.then(function(pdf) {
    linkService.setDocument(pdf, null);
    var numPages = pdf.numPages;
    pageInfo.textContent = '共 ' + numPages + ' 页';

    pdf.getPage(1).then(function(firstPage) {
      var baseViewport = firstPage.getViewport({ scale: 1 });
      var ratio = baseViewport.height / baseViewport.width;

      container.innerHTML = '';
      var wrappers = [];
      for (var i = 1; i <= numPages; i++) {
        var wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.style.aspectRatio = '1 / ' + ratio;
        var loading = document.createElement('div');
        loading.className = 'page-loading';
        loading.innerHTML = '<span class="spinner"></span>第 ' + i + ' 页';
        wrapper.appendChild(loading);
        wrapper.dataset.pageNum = i;
        container.appendChild(wrapper);
        wrappers.push(wrapper);
      }

      var rendered = {};
      function renderPage(pageNum) {
        if (rendered[pageNum]) return Promise.resolve();
        rendered[pageNum] = true;
        var wrapper = wrappers[pageNum - 1];
        return pdf.getPage(pageNum).then(function(page) {
          var cssWidth = wrapper.clientWidth;
          // 清晰度：放开 DPR 限制，高分屏渲染更清晰（最多 3 倍防止超大内存）
          var dpr = Math.min(window.devicePixelRatio || 1, 3);
          var viewport = page.getViewport({ scale: 1 });
          var scale = (cssWidth / viewport.width) * dpr;
          var scaledViewport = page.getViewport({ scale: scale });

          var canvas = document.createElement('canvas');
          canvas.width = scaledViewport.width;
          canvas.height = scaledViewport.height;

          wrapper.innerHTML = '';
          wrapper.appendChild(canvas);

          return page.render({
            canvasContext: canvas.getContext('2d'),
            viewport: scaledViewport
          }).promise.then(function() {
            // 叠加文本层，让链接可点击、文字可选中
            return page.getTextContent().then(function(textContent) {
              var textLayerDiv = document.createElement('div');
              textLayerDiv.className = 'textLayer';
              wrapper.appendChild(textLayerDiv);

              var textLayer = new pdfjsLib.TextLayer({
                textContentSource: textContent,
                container: textLayerDiv,
                viewport: scaledViewport,
                textDivs: []
              });
              textLayer.render();

              // 确保文本层尺寸与 canvas 一致
              textLayerDiv.style.width = scaledViewport.width + 'px';
              textLayerDiv.style.height = scaledViewport.height + 'px';
              // 适配 wrapper 宽度（canvas CSS 宽度 100%，文本层需同比缩放）
              var scaleCss = cssWidth / scaledViewport.width;
              textLayerDiv.style.transform = 'scale(' + scaleCss + ')';
              textLayerDiv.style.transformOrigin = 'top left';

              // 绑定链接跳转
              linkService.setViewer({ pageNumber: pageNum });
              var links = textLayerDiv.querySelectorAll('a');
              links.forEach(function(a) {
                a.addEventListener('click', function(e) {
                  var href = a.getAttribute('data-href') || a.getAttribute('href');
                  if (href) {
                    e.preventDefault();
                    window.open(href, '_blank', 'noopener,noreferrer');
                  }
                });
              });
            });
          });
        }).catch(function(err) {
          console.error('Page ' + pageNum + ' error:', err);
          rendered[pageNum] = false;
        });
      }

      [1, 2, 3].forEach(function(n) { if (n <= numPages) renderPage(n); });

      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            var n = parseInt(entry.target.dataset.pageNum, 10);
            renderPage(n);
            if (n + 1 <= numPages) renderPage(n + 1);
          }
        });
      }, { rootMargin: '800px 0px 800px 0px' });
      wrappers.forEach(function(w) { observer.observe(w); });
    });
  }).catch(function(err) {
    console.error('PDF load error:', err);
    container.innerHTML = '<div class="status error-fallback">' +
      '<div>作品集加载失败，可能是网络问题。</div>' +
      '<a href="' + PDF_URL + '" download>下载 PDF</a>' +
      '</div>';
  });
})();
</script>
</body>
</html>
